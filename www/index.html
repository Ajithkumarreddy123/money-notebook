<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Notebook</title>
<meta name="theme-color" content="#3B6CF6">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F1;--card:#fff;--ink:#14232B;--mute:#5D6F76;--line:#D3DEDC;--acc:#1D6F8C;--lent:#B26A00;--inc:#2E7D4F;--exp:#B23A48;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1F;--card:#17262D;--ink:#E7F0EE;--mute:#93A8AE;--line:#2A3D45;--acc:#5FB7D4;--lent:#E8A83A;--inc:#6CCB92;--exp:#F08A97}}
:root[data-theme="dark"]{--bg:#0F1A1F;--card:#17262D;--ink:#E7F0EE;--mute:#93A8AE;--line:#2A3D45;--acc:#5FB7D4;--lent:#E8A83A;--inc:#6CCB92;--exp:#F08A97}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:24px;font-weight:800;margin:8px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum small{display:block;color:var(--mute);font-size:12px}
.sum b{font-size:18px;font-weight:800}
#alert:not(:empty){background:var(--card);border:1px solid var(--exp);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
#alert b{color:var(--exp)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1 0 auto;padding:11px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 14px Manrope,system-ui,sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
form.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:13px;color:var(--mute);display:grid;gap:3px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px Manrope,system-ui,sans-serif}
.go{padding:12px;min-height:44px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:800 15px Manrope,system-ui,sans-serif;cursor:pointer}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;gap:5px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meta{font-size:13px;color:var(--mute)}
.act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.act button{min-height:42px;padding:8px 14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;font:600 14px Manrope,system-ui,sans-serif;cursor:pointer}
.act button[data-del],.act button[data-yes]{color:var(--exp);border-color:var(--exp)}
form.pay{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:4px}
form.pay input{flex:1;min-height:42px}
form.pay button{min-height:42px;padding:0 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:700 14px Manrope,system-ui,sans-serif;cursor:pointer}
.exp{color:var(--exp)}.inc{color:var(--inc)}.lent{color:var(--lent)}.warn{color:var(--exp);font-weight:700;font-size:13px}.ok{color:var(--inc);font-weight:700;font-size:13px}
.empty{color:var(--mute);text-align:center;padding:22px 8px;border:1px dashed var(--line);border-radius:10px}
.done{opacity:.65}
.txt{white-space:pre-wrap;word-break:break-word}
.note{font-size:12px;color:var(--mute);margin-top:18px}
.msg{padding:8px 10px;border-radius:10px;margin-bottom:6px;white-space:pre-wrap}.msg.user{background:var(--acc);color:#fff;margin-left:24px}.msg.assistant{background:var(--bg);margin-right:24px}
#chat{max-height:46vh;overflow-y:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:9px 14px;font:600 13px Manrope,system-ui,sans-serif;cursor:pointer}
.send{display:flex;gap:8px}.send .go{width:90px}
.sum .wide{grid-column:span 2}.sum .wide b{font-size:26px}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
input[type=checkbox]{width:22px;height:22px;padding:0}
form.pay label.chk{grid-column:span 2}
.go.out{background:var(--exp)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mute);font-size:12px;font-weight:600}td,th{padding:6px 4px;border-bottom:1px solid var(--line)}.tw{overflow-x:auto}.tw button{min-height:38px;padding:4px 10px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;font:600 13px Manrope,system-ui,sans-serif;cursor:pointer}.tw button[data-yes]{color:var(--exp);border-color:var(--exp)}
form.rec{display:grid;gap:8px;margin-top:6px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
form.pf{display:grid;gap:8px;margin-top:6px}
#lock{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);align-items:center;justify-content:center;padding:24px}#lock.on{display:flex}
.lk{display:grid;gap:10px;width:100%;max-width:320px;text-align:center}.lk input{text-align:center;font-size:22px;letter-spacing:6px}
.lf{background:none;border:0;color:var(--mute);text-decoration:underline;font:600 14px Manrope,system-ui,sans-serif;min-height:42px;cursor:pointer}

body{padding-bottom:86px}
main{padding-bottom:30px}
header#hd{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.lg{width:44px;height:44px;border-radius:12px;flex:none;animation:pop .5s ease both}
.hi{font-size:20px;font-weight:800;line-height:1.2}
#hd .sub{margin:0}
.row,.sum div,form.box{border-radius:16px;box-shadow:0 1px 4px rgba(20,35,43,.07)}
.sum .wide{background:linear-gradient(135deg,var(--acc),#14485C);color:#fff;border:0}
.sum .wide small{color:#D9EEF5}.sum .wide b{color:#fff!important}
.go{background:linear-gradient(135deg,var(--acc),#14485C)}.go.out{background:linear-gradient(135deg,#C9505E,#8F2736)}
button{transition:transform .12s ease}button:active{transform:scale(.96)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;display:grid;justify-items:center;gap:1px;padding:6px 2px;border:0;background:none;color:var(--mute);border-radius:12px;font:700 11px Manrope,system-ui,sans-serif;cursor:pointer}
#nav button span{font-size:22px;line-height:1.1}
#nav button[aria-selected="true"]{color:var(--acc);background:rgba(29,111,140,.12)}
#nav button[aria-selected="true"] span{animation:pop .35s ease}
h2.pt{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;margin:4px 0 12px}
.back{width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:800 20px Manrope,system-ui,sans-serif;cursor:pointer}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa button,.menu button{display:grid;justify-items:center;gap:4px;padding:12px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;font:700 13px Manrope,system-ui,sans-serif;cursor:pointer;box-shadow:0 1px 4px rgba(20,35,43,.07)}
.qa button span,.menu button span{font-size:26px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{padding:18px 8px}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:14px;font-weight:700;transform:translateY(-140%);transition:transform .35s ease;max-width:520px;margin:0 auto}
#toast.on{transform:none}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}}
#view>*{animation:fade .4s ease both}#view>*:nth-child(2){animation-delay:.05s}#view>*:nth-child(3){animation-delay:.1s}#view>*:nth-child(4){animation-delay:.15s}#view>*:nth-child(n+5){animation-delay:.2s}
.sum div{animation:fade .45s ease both}
.bar i{transform-origin:left;animation:grow .9s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Telehealth-style redesign ===== */
:root{--bg:#F2F5FC;--card:#fff;--ink:#0E1A3D;--mute:#6C7BA0;--line:#E6ECF8;--acc:#3B6CF6;--lent:#E08A00;--inc:#12A06A;--exp:#E5484D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1124;--card:#131D3A;--ink:#EAF0FF;--mute:#93A2C7;--line:#22305A;--acc:#6C8DFF;--lent:#F5B13D;--inc:#4FD39B;--exp:#FF8A8F}}
:root[data-theme="dark"]{--bg:#0A1124;--card:#131D3A;--ink:#EAF0FF;--mute:#93A2C7;--line:#22305A;--acc:#6C8DFF;--lent:#F5B13D;--inc:#4FD39B;--exp:#FF8A8F}
body{padding-bottom:110px}
header#hd{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.av{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:21px;color:#fff;background:linear-gradient(135deg,#3B6CF6,#7C9BFF);box-shadow:0 6px 16px rgba(59,108,246,.35)}
.gt{flex:1;min-width:0}.gt .sub{margin:0;font-size:13px}.nm{font-size:21px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sum .wide small{font-size:13px;color:#E4ECFF}.sum .wide b{font-size:34px;color:#fff!important}
.qa{gap:6px}
.qa button,.menu button{border:0;background:none;box-shadow:none;padding:6px 2px;gap:8px;font-weight:700;font-size:12.5px}
.qa button span{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:26px}
.qa button:nth-child(1) span{background:rgba(229,72,77,.13)}.qa button:nth-child(2) span{background:rgba(18,160,106,.14)}

.menu{gap:12px}.menu button{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 18px rgba(40,70,140,.07);padding:20px 8px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.dy{flex:0 0 54px;display:grid;justify-items:center;gap:2px;padding:10px 0 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;font:700 12px Manrope,system-ui,sans-serif;cursor:pointer}
.dy small{color:var(--mute);font-size:11px}.dy b{font-size:18px}.dy i{width:6px;height:6px;border-radius:50%;background:transparent}.dy i.dot{background:var(--acc)}
.dy.tdy{border-color:var(--acc)}
.dy.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 18px rgba(59,108,246,.35)}.dy.on small{color:#DCE6FF}.dy.on i.dot{background:#fff}
.next{position:relative;overflow:hidden;display:grid;gap:6px;padding:18px;margin-bottom:10px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#2F5BE0,#5C86FF);box-shadow:0 12px 26px rgba(59,108,246,.30)}

input,textarea,select{border:1.5px solid var(--line);border-radius:14px}

#nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;border:0;border-radius:28px;padding:8px;gap:4px;background:var(--card);box-shadow:0 12px 34px rgba(30,60,140,.22)}
#nav button{border-radius:20px;padding:8px 2px}
#nav button[aria-selected="true"]{background:var(--acc);color:#fff;box-shadow:0 6px 14px rgba(59,108,246,.4)}

<script>
var KEY="moneyNotebook1",S={exp:[],lent:[],inc:[],notes:[],chits:[],goal:null,rem:[],name:"Friend",sav:{start:0,set:false,tx:[]},ts:0},tab="home",DB=null,UID=null,busy=false,chat=[];
function ok(p){return p&&p.exp&&p.lent&&p.inc;}
function norm(p){p.notes=p.notes||[];p.chits=p.chits||[];p.goal=p.goal||null;p.rem=p.rem||[];p.name=p.name||"Friend";p.sav=p.sav||{start:0,set:false,tx:[]};p.sav.tx=p.sav.tx||[];p.ts=p.ts||0;return p;}
function txsum(){return S.sav.tx.reduce(function(a,t){return a+t.amt},0);}
function bal(){return (S.sav.start||0)+txsum();}
function tx(a,date,note,ref,tm){S.sav.tx.push({id:id(),date:date,tm:tm||nowT(),amt:a,note:note||"",ref:ref||""});try{piggy(a);}catch(e){}}
try{var raw=localStorage.getItem(KEY);if(raw){var p0=JSON.parse(raw);if(ok(p0))S=norm(p0);}}catch(e){}
function setStatus(t){var el=document.getElementById("st");if(el)el.textContent=t;}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
 if(DB&&UID){DB.doc("data/users/"+UID+"/book").set(S).catch(function(){setStatus("Could not sync. Saved on this phone only.");});}}
async function init(){
 if(typeof claude==="undefined"){setStatus("Saved on this phone. Works offline.");render();return;}
 try{
  var user=await claude.use("user"),db=await claude.use("db");
  if(user&&db){var uid=await user.id();
   if(uid){DB=db;UID=uid;
    var snap=await db.doc("data/users/"+uid+"/book").get(),d=snap.exists?snap.data():null;
    if(ok(d)&&(d.ts||0)>(S.ts||0)){S=norm(d);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
    else if(S.exp.length+S.lent.length+S.inc.length+S.notes.length+S.sav.tx.length+S.chits.length+S.rem.length+(S.sav.set?1:0)){save();}
    setStatus("Saved to your account and this phone.");}}
 }catch(e){}
 render();
}
function inr(n){return (n<0?"-":"")+"\u20B9"+Math.abs(Math.round(n)).toLocaleString("en-IN");}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function addMonths(d,m){var x=new Date(d);x.setMonth(x.getMonth()+m);return x;}
function fmt(d){return new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});}
function pad2(n){return String(n).padStart(2,"0");}
function nowT(){var d=new Date();return pad2(d.getHours())+":"+pad2(d.getMinutes());}
function tm12(t){var p=String(t||"").split(":"),h=+p[0],m=p[1]||"00";if(isNaN(h))return"";var ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+m+" "+ap;}
function ft(x){var d=x.date||x.start;return fmt(d)+(x.tm?" \u00B7 "+tm12(x.tm):"");}
function loan(l){
 var i=(l.intr!=null)?l.intr:(l.amt*(l.rate||0)*l.months/100),total=l.amt+i;
 var got=(l.payments||[]).reduce(function(a,p){return a+p.amt},0),rem=Math.max(0,total-got);
 if(l.paid){got=total;rem=0;}
 var due=addMonths(l.start,l.months);
 return{full:i,total:total,got:got,rem:rem,done:rem<=0,due:due,days:Math.ceil((due.getTime()-Date.now())/864e5)};
}
function status(c){if(c.done)return'<span class="ok">Repaid</span>';if(c.days<0)return'<span class="warn">Overdue by '+(-c.days)+' days</span>';if(c.days<=7)return'<span class="warn">Due in '+c.days+' days</span>';return"";}
function sum(){
 var m=today().slice(0,7),e=0,i=0,rem=0,intr=0,al=[];
 S.exp.forEach(function(x){if(x.date.slice(0,7)===m)e+=x.amt});
 S.inc.forEach(function(x){if(x.date.slice(0,7)===m)i+=x.amt});
 S.lent.forEach(function(l){var c=loan(l);if(!c.done){rem+=c.rem;intr+=c.full;if(c.days<=7)al.push('<b>'+esc(l.who)+'</b> '+inr(c.rem)+(c.days<0?' overdue by '+(-c.days)+' days':' due in '+c.days+(c.days===1?' day':' days')));}});
 var dm=new Date().getDate();
 S.chits.forEach(function(c){if(!c.dueDay)return;var np=0,pm=false;c.recs.forEach(function(r){if(r.kind!=="in"){np++;if(r.date.slice(0,7)===m)pm=true;}});if(pm||(c.months&&np>=c.months))return;var df=c.dueDay-dm;if(df<=3)al.push('<b>'+esc(c.name)+'</b> chit '+(c.monthly?inr(c.monthly)+' ':'')+(df<0?'overdue by '+(-df)+' days':df===0?'due today':'due in '+df+(df===1?' day':' days')));});
 alp=al.map(function(x){return x.replace(/<[^>]+>/g,"")});
 var bl=bal(),cp=0,cr=0;S.chits.forEach(function(c){c.recs.forEach(function(r){if(r.kind==="in")cr+=r.amt;else cp+=r.amt;});});
 document.getElementById("sum").innerHTML='<div class="wide"><small>💰 Current savings</small><b id="hero" class="'+(bl<0?'exp':'inc')+'">'+inr(bl)+'</b></div><div><small>🧾 Spent this month</small><b class="exp">'+inr(e)+'</b></div><div><small>💵 Extra income</small><b class="inc">'+inr(i)+'</b></div><div><small>🤝 To get back</small><b class="lent">'+inr(rem)+'</b></div><div><small>📈 Interest to receive</small><b class="lent">'+inr(intr)+'</b></div><div><small>🪙 Chit paid</small><b class="exp">'+inr(cp)+'</b></div><div><small>🎁 Chit received</small><b class="inc">'+inr(cr)+'</b></div>';
 var he=document.getElementById("hero");if(he&&prevBal!==null&&prevBal!==bl)countTo(he,prevBal,bl);prevBal=bl;
 document.getElementById("alert").innerHTML=al.length?al.join("<br>"):"";
}

var selDay=null,alp=[],prevBal=null,MAIN=["home","sav","lent","chit","plan","rcpt"],PT={plan:"📊 Plan",rcpt:"🧾 Receipts",more:"☰ More",sav:"💰 Savings",exp:"🧾 Spend",lent:"🤝 Lent",chit:"🪙 Chit funds",inc:"💵 Income",notes:"📝 Notes",rem:"⏰ Reminders",ai:"🤖 Ask AI",set:"⚙️ Settings"},SUB=["exp","inc","notes","rem","ai","set"];
function greetWord(){var h=new Date().getHours();return h>=5&&h<12?"Good morning":h>=12&&h<17?"Good afternoon":h>=17&&h<21?"Good evening":"Good night";}
function greetEmoji(){var h=new Date().getHours();return h>=5&&h<12?"\uD83C\uDF05":h>=12&&h<17?"\u2600\uFE0F":h>=17&&h<21?"\uD83C\uDF07":"\uD83C\uDF19";}
function greet(){var nm=S.name||"Friend",g=function(i){return document.getElementById(i);};if(!g("hi"))return;g("hi").textContent=greetEmoji()+" "+greetWord();g("nm").textContent=nm;g("av").textContent=nm.charAt(0).toUpperCase();g("ck").textContent=tm12(nowT());g("dt").textContent=new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});}

function dayStrip(){var h='<div class="days">',b=new Date();b.setHours(0,0,0,0);var nm=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 for(var k=-1;k<6;k++){var d=new Date(b.getTime()+k*864e5),ds=d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()),has=S.rem.some(function(r){return r.date===ds&&!r.done;});

 var v=document.getElementById("view"),h="";
 var amtDate='<div class="two"><label>Amount (\u20B9)<input name="amt" type="number" inputmode="decimal" min="1" step="any" required></label><label>Date<input name="date" type="date" value="'+today()+'" required></label></div><label>Time<input name="tm" type="time" value="'+nowT()+'" required></label>';

  h+='<div class="qa"><button data-go="exp"><span>🧾</span>Spend</button><button data-go="inc"><span>💵</span>Income</button><button data-go="rem"><span>⏰</span>Remind</button><button data-go="notes"><span>📝</span>Note</button></div>';
  h+=dayStrip();
   var all=remSorted();
   if(selDay){var dl=all.filter(function(r){return r.date===selDay});h+='<h2 class="pt">\uD83D\uDDD3 '+fmt(selDay)+'</h2>'+(dl.length?dl.map(function(r){return remRow(r,false)}).join(""):'<div class="empty">Nothing planned for this day.</div>');}
   else{var up=all.filter(function(r){return !r.done}).slice(0,4);h+='<h2 class="pt">\u23F0 Coming up</h2>';
    if(up.length){var r0=up[0];h+='<div class="next"><small>Next reminder</small><b class="txt">'+esc(r0.text)+'</b><span>\uD83D\uDDD3 '+fmt(r0.date)+' \u00B7 \u23F0 '+tm12(r0.time||"09:00")+'</span><button data-rdone="'+r0.id+'">\u2713 Mark done</button></div>'+up.slice(1).map(function(r){return remRow(r,false)}).join("");}
    else h+='<div class="empty">\uD83C\uDF89 Nothing pending. Add a reminder to stay on track.</div>';}
 }else if(tab==="more"){

 }else if(tab==="plan"){h+=planPage();}else if(tab==="rcpt"){h+=rcptPage();}else if(tab==="rem"){

  h+=S.rem.length?remSorted().map(function(r){return remRow(r,true)}).join(""):'<div class="empty">No reminders yet.</div>';
 }else if(tab==="sav"){
  var mo=today().slice(0,7),ad=0,tk=0;S.sav.tx.forEach(function(t){if(t.date.slice(0,7)===mo){if(t.amt>0)ad+=t.amt;else tk-=t.amt;}});

  var gl=S.goal;

 el.className="show";clearTimeout(piggy.t);piggy.t=setTimeout(function(){el.className="";},2600);}
/* plan */
function ym(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1);}
function pget(){try{return JSON.parse(localStorage.getItem(PK2)||"null");}catch(e){return null;}}
function pset(p){try{localStorage.setItem(PK2,JSON.stringify(p));}catch(e){}}
function guessCat(t){t=(t||"").toLowerCase();var m=[["Rent",/rent|room|hostel|pg\b/],["Food",/food|lunch|dinner|tea|coffee|snack|grocer|milk|swiggy|zomato|veg|rice|biryani/],["Travel",/bus|petrol|fuel|auto|cab|uber|ola|train|metro|ticket/],["Bills",/bill|recharge|wifi|electric|water|emi|gas/],["Fun",/movie|game|party|trip|shop|cloth|fun/]];for(var i=0;i<m.length;i++)if(m[i][1].test(t))return m[i][0];return"Other";}
function catSel(){return'<label>Category<select name="cat"><option value="">Auto-detect</option>'+CATS.filter(function(c){return c[0]!=="Savings";}).map(function(c){return'<option>'+c[0]+'</option>';}).join("")+'</select></label>';}
function actual(){var mo=ym(),a={};CATS.forEach(function(c){a[c[0]]=0;});S.exp.forEach(function(x){if((x.date||"").slice(0,7)===mo)a[x.cat||guessCat(x.note)]+=x.amt;});S.sav.tx.forEach(function(t){if(t.amt>0&&!t.ref&&(t.date||"").slice(0,7)===mo)a.Savings+=t.amt;});return a;}
function planPage(){var p=pget(),A=actual(),h='<h2 class="pt">\uD83D\uDCCA Salary plan</h2>';
 if(!p||p.m!==ym()){return h+'<div class="box"><label>Monthly salary (\u20B9)<input id="plsal" type="number" inputmode="decimal" min="1" value="'+(p?p.salary:"")+'"></label><button class="go" data-pl="gen">\u2728 Make my smart plan</button><span class="meta">The smart plan splits your salary into rent, food, travel, bills, fun and savings. You can edit your own plan in the first 7 days of the month, then it locks so you can check if you followed it.</span></div>';}
 var d=new Date(),ed=d.getDate()<=7||Date.now()-p.created<7*864e5,tm=0,ok=0,sp=0,spA=0,dl=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1;
 CATS.forEach(function(c){var k=c[0],m=p.mine[k]||0,ac=A[k]||0;tm+=m;if(k!=="Savings"){sp+=m;spA+=ac;if(ac<=m)ok++;}});
 h+='<div class="next"><small>Safe to spend per day</small><b>'+rs(Math.max(0,sp-spA)/dl)+'</b><span>'+ok+' of 6 spending areas on track \u00B7 salary '+rs(p.salary)+'</span></div>';
 if(Math.round(tm)!==Math.round(p.salary))h+='<div class="empty">Your plan adds up to '+rs(tm)+' but salary is '+rs(p.salary)+'.</div>';
 CATS.forEach(function(c){var k=c[0],m=p.mine[k]||0,ai=p.ai[k]||0,ac=A[k]||0,pc=m?Math.round(ac/m*100):0,sv=k==="Savings",st=sv?(ac>=m?"\u2705 Goal met":"Keep saving"):(pc>100?"\uD83D\uDD34 Over":pc>80?"\uD83D\uDFE0 Near limit":"\uD83D\uDFE2 On track");
  h+='<div class="row"><div class="top"><b>'+c[1]+' '+k+'</b><span class="meta">'+st+'</span></div><div class="pr"><div><small>Smart plan</small><b>'+rs(ai)+'</b></div><div><small>My plan</small>'+(ed?'<input class="pin" type="number" inputmode="decimal" data-pm="'+k+'" value="'+m+'">':'<b>'+rs(m)+'</b>')+'</div><div><small>Actual</small><b>'+rs(ac)+'</b></div></div><div class="bar"><i style="width:'+Math.min(100,pc)+'%;background:'+(sv||pc<=80?'var(--inc)':pc>100?'var(--exp)':'var(--lent)')+'"></i></div></div>';});
 return h+(ed?'<div class="act"><button data-pl="reset">Reset to smart plan</button><button data-pl="new">Change salary</button></div><span class="meta">\u270F\uFE0F You can edit your plan until day 7 of the month.</span>':'<span class="meta">\uD83D\uDD12 Plan is locked until next month so you can see if you followed it.</span>');}
/* receipts */
function idb(){return new Promise(function(res,rej){var q=indexedDB.open("mnReceipts",1);q.onupgradeneeded=function(){q.result.createObjectStore("r",{keyPath:"id"});};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
async function rcAll(){try{var d=await idb();return await new Promise(function(r){var q=d.transaction("r").objectStore("r").getAll();q.onsuccess=function(){r(q.result.sort(function(a,b){return b.ts-a.ts;}));};q.onerror=function(){r([]);};});}catch(e){return[];}}
async function rcPut(o){var d=await idb();return new Promise(function(r){var t=d.transaction("r","readwrite");t.objectStore("r").put(o);t.oncomplete=r;t.onerror=r;});}
async function rcDel(i){var d=await idb();return new Promise(function(r){var t=d.transaction("r","readwrite");t.objectStore("r").delete(i);t.oncomplete=r;});}
function shrink(f){return new Promise(function(res){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.6));};im.onerror=function(){res(null);};im.src=u;});}
function rcptPage(){setTimeout(rcFill,0);return'<h2 class="pt">\uD83E\uDDFE Bills &amp; receipts</h2><div class="box"><label>What is it for<input id="rct" maxlength="60" placeholder="e.g. Electricity bill"></label><label>Amount (optional)<input id="rca" type="number" inputmode="decimal"></label><label>Photo of the bill<input id="rcf" type="file" accept="image/*"></label><button class="go" data-rc="add">Save receipt</button></div><div id="rclist" class="rcg"></div>';}
async function rcFill(){var el=$("rclist");if(!el)return;var a=await rcAll();el.innerHTML=a.length?a.map(function(r){return'<div class="rc"><img src="'+r.img+'" data-rcv="'+r.id+'" alt="Receipt"><b>'+esc(r.title)+'</b><small>'+(r.amt?rs(r.amt)+' \u00B7 ':'')+fmt(r.date)+'</small><button data-rcd="'+r.id+'" aria-label="Delete">\uD83D\uDDD1</button></div>';}).join(""):'<div class="empty">No receipts saved yet.</div>';}
document.getElementById("view").addEventListener("click",async function(e){var b=e.target.closest("[data-pl],[data-rc],[data-rcv],[data-rcd],[data-ft]");if(!b)return;var d=b.dataset;
 if(d.ft){var k=d.ft;CFG.feat=CFG.feat||{};CFG.feat[k]=!F(k);cfgSave();if(k==="notif"&&F(k)){var g=await notifOn();toast(g?"Notifications on \uD83D\uDD14":"Allow notifications in phone settings");syncNotifs();}render();return;}
 if(d.pl){var p=pget();if(d.pl==="gen"){var sal=+$("plsal").value;if(!(sal>0)){toast("Enter your salary");return;}var ai={};CATS.forEach(function(c){ai[c[0]]=Math.round(sal*c[2]/100);});pset({m:ym(),salary:sal,ai:ai,mine:Object.assign({},ai),created:Date.now()});}
  else if(d.pl==="reset"&&p){p.mine=Object.assign({},p.ai);pset(p);}else if(d.pl==="new"){try{localStorage.removeItem(PK2);}catch(x){}}render();return;}
 if(d.rc==="add"){var f=$("rcf").files[0],t=$("rct").value.trim();if(!f||!t){toast("Add a name and a photo");return;}var img=await shrink(f);if(!img){toast("Could not read photo");return;}await rcPut({id:id(),ts:Date.now(),date:today(),title:t,amt:+$("rca").value||0,img:img});toast("Receipt saved \uD83E\uDDFE");render();return;}
 if(d.rcd){await rcDel(d.rcd);rcFill();return;}
 if(d.rcv){var o=document.createElement("div");o.className="rcv";o.innerHTML='<img src="'+b.src+'" alt="Receipt">';o.onclick=function(){o.remove();};document.body.appendChild(o);}});
document.getElementById("view").addEventListener("change",function(e){var k=e.target.dataset&&e.target.dataset.pm;if(k){var p=pget();if(p){p.mine[k]=Math.max(0,+e.target.value||0);pset(p);render();}}});
$("burger").onclick=function(){$("nav").classList.toggle("open");$("scrim").classList.toggle("on");};
function closeNav(){$("nav").classList.remove("open");$("scrim").classList.remove("on");}
$("scrim").onclick=closeNav;$("nav").addEventListener("click",function(e){if(e.target.closest("button"))closeNav();});

function findLoan(i){return S.lent.filter(function(l){return l.id===i})[0];}
var view=document.getElementById("view");
document.getElementById("nav").onclick=function(e){var b=e.target.closest("button");if(b){tab=b.dataset.t;render();window.scrollTo(0,0);}};
view.onsubmit=function(ev){
 ev.preventDefault();var f=ev.target,g=function(n){return f.elements[n]?f.elements[n].value:"";},sv=f.elements.sv&&f.elements.sv.checked;
 if(f.id==="cf"){var q=f.elements.q,t=q.value;q.value="";ask(t);return;}
 if(f.id==="f0"){S.sav.start=+g("start")-txsum();S.sav.set=true;save();render();return;}
 if(f.id==="fs")return;
 if(f.id==="fn"){S.name=g("nm").trim()||"Friend";save();render();return;}
 if(f.id==="fr"){S.rem.push({id:id(),text:g("text").trim(),date:g("date"),time:g("time")||"09:00",done:false,notified:false});save();render();tick();return;}
 if(f.id==="fg"){S.goal={name:g("name").trim(),target:+g("target"),date:g("date")};save();render();return;}
 if(f.id==="fp"){var p1=g("pin"),p2=g("pin2");if(!/^\d{4,6}$/.test(p1)||p1!==p2){alert("PINs must match and be 4 to 6 digits.");return;}var sl=id();hash(p1,sl).then(function(h){localStorage.setItem(PK,JSON.stringify({s:sl,h:h}));render();});return;}
 if(f.className==="rec"){var c=findChit(f.dataset.c),a2=+g("amt");if(c&&a2>0){var r={id:id(),date:g("date"),tm:nowT(),amt:a2,kind:g("kind"),mo:g("mo").trim()};c.recs.push(r);if(sv)tx(r.kind==="in"?a2:-a2,r.date,(r.kind==="in"?"Chit received: ":"Chit paid: ")+c.name,c.id+":"+r.id);save();render();}return;}
 if(f.className==="pay"){var l=findLoan(f.dataset.id),a=+g("pa");if(l&&a>0){var pid=id();(l.payments=l.payments||[]).push({id:pid,amt:a,date:today()});if(sv)tx(a,today(),"Payment from "+l.who,l.id+":"+pid);save();render();}return;}
 if(tab==="lent"){var n={id:id(),who:g("who").trim(),amt:+g("amt"),start:g("date"),tm:g("tm")||nowT(),intr:+g("intr"),months:+g("months"),payments:[]};S.lent.push(n);if(sv)tx(-n.amt,n.start,"Lent to "+n.who,n.id,n.tm);}
 else if(tab==="chit"){S.chits.push({id:id(),name:g("name").trim(),months:+g("months")||0,dueDay:+g("dd")||0,monthly:+g("ma")||0,recs:[]});}
 else if(tab==="notes"){S.notes.push({id:id(),date:today(),tm:nowT(),text:g("text").trim()});}
 else{var x={id:id(),amt:+g("amt"),date:g("date"),tm:g("tm")||nowT(),note:g("note").trim(),cat:(tab==="exp"?g("cat"):"")};S[tab].push(x);if(sv)tx(tab==="exp"?-x.amt:x.amt,x.date,(tab==="exp"?"Spent: ":"Income: ")+x.note,x.id,x.tm);}
 save();render();
};
view.onclick=function(e){
 var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 if(d.del){b.parentNode.innerHTML='<span class="meta">'+(d.del==="tx"?"Delete this?":"Delete this? Its savings entry goes too.")+'</span><button data-yes="'+d.del+'" data-c="'+(d.c||"")+'" data-id="'+d.id+'">Yes, delete</button><button data-no="1">Cancel</button>';}
 else if(d.yes){if(d.yes==="goal"){S.goal=null;}else if(d.yes==="rec"){var ch=findChit(d.c);if(ch)ch.recs=ch.recs.filter(function(r){return r.id!==d.id});S.sav.tx=S.sav.tx.filter(function(t){return t.ref!==d.c+":"+d.id});}else if(d.yes==="tx"){S.sav.tx=S.sav.tx.filter(function(t){return t.id!==d.id});}else{S[d.yes]=S[d.yes].filter(function(x){return x.id!==d.id});S.sav.tx=S.sav.tx.filter(function(t){var r=t.ref||"";return r!==d.id&&r.indexOf(d.id+":")!==0;});}save();render();}
 else if(d.no){render();}
 else if(d.sv){var f=b.form;if(!f||!f.reportValidity())return;var a=+f.elements.amt.value;if(!(a>0))return;tx(d.sv==="add"?a:-a,f.elements.date.value,f.elements.note.value.trim(),"",f.elements.tm.value);save();render();}
 else if(d.full){var l=findLoan(d.full);if(l){var c=loan(l);if(c.rem>0){var pid=id();(l.payments=l.payments||[]).push({id:pid,amt:c.rem,date:today()});tx(c.rem,today(),"Repaid by "+l.who,l.id+":"+pid);}save();render();}}
 else if(d.bk==="copy"){doCopy();}
 else if(d.bk==="dl"){doDl();}
 else if(d.bk==="restore"){doRestore(b);}
 else if(d.lk){lkAction(d.lk);}
  else if(d.day){selDay=(selDay===d.day)?null:d.day;render();}
 else if(d.go){tab=d.go;render();window.scrollTo(0,0);}
 else if(d.rdone){S.rem.forEach(function(r){if(r.id===d.rdone)r.done=true;});save();render();}
 else if(d.notif){try{Notification.requestPermission().then(function(){render();});}catch(e){}}
 else if(d.q){ask(d.q);}
};
view.onchange=function(e){if(e.target.id==="lkafter"){CFG.after=+e.target.value;cfgSave();return;}if(e.target.id==="rf"&&e.target.files[0]){var r=new FileReader();r.onload=function(){document.getElementById("rs").value=r.result;note("File loaded. Tap Restore from text.");};r.readAsText(e.target.files[0]);}};
