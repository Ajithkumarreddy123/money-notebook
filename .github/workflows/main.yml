name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Set app icon
        run: |
          pip install --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          import shutil
          res = "android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          src = Image.open("icon.png").convert("RGBA")
          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              im = src.resize((s, s), Image.LANCZOS)
              for n in ["ic_launcher", "ic_launcher_round", "ic_launcher_foreground"]:
                  im.save(res + "/mipmap-" + d + "/" + n + ".png")
          PY
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MoneyNotebook-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
